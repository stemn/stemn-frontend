# electron-builder 26 configuration for Stemn Desktop.
#   npm run package          Linux AppImage + unpacked dir (release/)
#   npm run package:win      Windows NSIS installer (run on Windows or with wine)
#   npm run package:mac      macOS dmg + zip (run on macOS, needs signing for notarisation)
# Everything the app needs is bundled into dist/ by electron-vite, so the
# packaged app ships no node_modules.
appId: stemn.stemn
productName: Stemn
copyright: Copyright © STEMN Pty Ltd
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json

asar: true
compression: normal
npmRebuild: false
nodeGypRebuild: false

extraMetadata:
  main: dist/main/index.js

protocols:
  - name: Stemn
    schemes:
      - stemn

# electron-updater reads this (written into the app as app-update.yml)
publish:
  - provider: github
    owner: Stemn
    repo: Stemn-Desktop

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: Stemn

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - dmg
    - zip # required by electron-updater on macOS
  hardenedRuntime: true

dmg:
  background: build/background.png
  contents:
    - x: 448
      y: 344
      type: link
      path: /Applications
    - x: 192
      y: 344
      type: file

linux:
  category: Development;Engineering
  icon: build/icons
  executableName: stemn
  syncDesktopName: true
  synopsis: Versioning and project management for engineering files
  target:
    - AppImage
    - dir
  desktop:
    entry:
      Name: Stemn
      Comment: Stemn Desktop
      StartupWMClass: Stemn
      MimeType: x-scheme-handler/stemn;
