name: Set up the frontend workspace
description: Node 24 + pnpm (the packageManager version) + pnpm install --frozen-lockfile (with the pnpm store cache) for the stemn-frontend workspace. Optionally downloads the Electron binary.
inputs:
  electron:
    description: Also download the Electron binary (needed to run the desktop app)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: pnpm install
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        HUSKY: '0'
    - name: Electron binary
      if: inputs.electron == 'true'
      shell: bash
      run: node stemn-frontend-desktop/node_modules/electron/install.js
