name: CI

on:
  pull_request:
  push:
    branches: [staging, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint (eslint + prettier)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  unit:
    name: unit tests (vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: website-vite
            command: npm run build
          - target: website-webpack-fallback
            command: npm run build:webpack
          - target: desktop
            command: npm run desktop:build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: ${{ matrix.command }}

  desktop-updater:
    name: desktop updater (AppImage + local feed)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          electron: true
      - name: Release config (electron-builder schema, all platforms and editions)
        working-directory: stemn-frontend-desktop
        run: |
          npm run package:check
          STEMN_EDITION=eu UPDATES_CHANNEL=beta npm run package:check
      - name: Electron runtime libraries, FUSE (AppImage) + xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libgtk-3-0t64 libxss1 libasound2t64 libgbm1 libxshmfence1 libfuse2t64
      - name: Updater integration test (packages an unsigned AppImage, serves a local generic feed)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npm run desktop:test:updater
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-updater-${{ github.run_attempt }}
          path: |
            stemn-frontend-desktop/qa/updater-*.png
            stemn-frontend-desktop/qa/updater-results
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: docker image (website)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the website image
        run: docker build -f stemn-frontend-website/Dockerfile -t stemn-website:ci .
      - name: Serve it
        run: |
          docker run -d --name website -p 8081:8081 stemn-website:ci
          for i in $(seq 30); do curl -fsS http://localhost:8081/api/ping && break; sleep 1; done
          curl -fsS http://localhost:8081/explore | grep -q '<div class="layout-column flex" id="app">'

  e2e:
    name: e2e
    # The backend is a private repository: its deploy key is not available to pull
    # requests from forks, so they skip this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e.yml
    secrets:
      STEMN_BACKEND_DEPLOY_KEY: ${{ secrets.STEMN_BACKEND_DEPLOY_KEY }}
