name: Set up the frontend workspace
description: Node 24 + npm ci (with the npm cache) for the stemn-frontend workspaces. Optionally downloads the Electron binary.
inputs:
  electron:
    description: Also download the Electron binary (needed to run the desktop app)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: npm ci
      shell: bash
      run: npm ci --no-audit --no-fund
      env:
        HUSKY: '0'
    - name: Electron binary
      if: inputs.electron == 'true'
      shell: bash
      run: node node_modules/electron/install.js
