name: CI

on:
  pull_request:
  push:
    branches: [staging, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint (eslint + prettier)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  unit:
    name: unit tests (vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: website-vite
            command: pnpm run build
          - target: website-webpack-fallback
            command: pnpm run build:webpack
          - target: desktop
            command: pnpm run desktop:build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: ${{ matrix.command }}
      # the main chunks (what index.html loads first) may not grow beyond the committed baseline + 2%: viewers,
      # three.js and the diff UI are lazy chunks (stemn-frontend-website/scripts/bundleSize.js)
      - name: Main bundle size (gzip) against bundle-size-baseline.json
        if: matrix.target == 'website-vite'
        run: pnpm --filter stemn-frontend-website run size

  docker:
    name: docker image (website)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the website image
        run: docker build -f stemn-frontend-website/Dockerfile -t stemn-website:ci .
      - name: Serve it
        run: |
          docker run -d --name website -p 8081:8081 stemn-website:ci
          for i in $(seq 30); do curl -fsS http://localhost:8081/api/ping && break; sleep 1; done
          curl -fsS http://localhost:8081/explore | grep -q '<div class="layout-column flex" id="app">'

  e2e:
    name: e2e
    # The backend is a private repository: its deploy key is not available to pull
    # requests from forks, so they skip this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e.yml
    # DEMONSTRATION: the backend fixture runs stemn-backend's pnpm branch (stemn/stemn-backend#182), whose
    # local/start.sh installs with pnpm. Back to the default (staging) once that PR is merged.
    with:
      backend-ref: chore/pnpm
    secrets:
      STEMN_BACKEND_DEPLOY_KEY: ${{ secrets.STEMN_BACKEND_DEPLOY_KEY }}
